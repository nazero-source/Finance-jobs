name: Mise à jour quotidienne des offres

on:
  schedule:
    - cron: "17 4 * * *"     # tous les jours vers 5h-6h (heure de Paris)
  workflow_dispatch:          # bouton « Run workflow » pour lancer à la main
  push:
    branches: [main]
    paths: ["docs/**", "!docs/data/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collecte des offres
        if: github.event_name != 'push'
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          JOOBLE_API_KEY_FR: ${{ secrets.JOOBLE_API_KEY_FR }}
          JOOBLE_API_KEY_UK: ${{ secrets.JOOBLE_API_KEY_UK }}
          JOOBLE_API_KEY_DE: ${{ secrets.JOOBLE_API_KEY_DE }}
          JOOBLE_API_KEY_CH: ${{ secrets.JOOBLE_API_KEY_CH }}
          JOOBLE_API_KEY_NL: ${{ secrets.JOOBLE_API_KEY_NL }}
          JOOBLE_API_KEY_ES: ${{ secrets.JOOBLE_API_KEY_ES }}
          JOOBLE_API_KEY_IT: ${{ secrets.JOOBLE_API_KEY_IT }}
          JOOBLE_API_KEY_AE: ${{ secrets.JOOBLE_API_KEY_AE }}
          JOOBLE_API_KEY_SG: ${{ secrets.JOOBLE_API_KEY_SG }}
          JOOBLE_API_KEY_BR: ${{ secrets.JOOBLE_API_KEY_BR }}
        run: python scraper/run.py
      - name: Contacts clés (chaque lundi, chiffrés)
        if: github.event_name != 'push'
        env:
          CONTACTS_KEY: ${{ secrets.CONTACTS_KEY }}
        run: |
          if [ -n "$CONTACTS_KEY" ] && { [ "$(date +%u)" = "1" ] || [ ! -f docs/data/contacts.enc.json ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; }; then
            pip install --quiet cryptography && python scraper/contacts.py
          else
            echo "Contacts : pas de mise à jour aujourd'hui (ou CONTACTS_KEY absent)"
          fi
      - name: Enregistrement des données
        if: github.event_name != 'push'
        run: |
          git config user.name "finance-jobs-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data scraper/geocache.json
          git diff --cached --quiet || git commit -m "Offres du $(date -u +%Y-%m-%d)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
